services:
  mariadb-bryan:
    image: mariadb:10.11
    container_name: mariadb-bryan
    environment:
      MARIADB_ROOT_PASSWORD: senha-bryan-123   # somente para laboratório
      MARIADB_DATABASE: loja_bryan
    ports:
      - "3307:3306"
    volumes:
      - dados-mariadb-bryan:/var/lib/mysql
      - ./script.sql:/scripts/script.sql:ro

volumes:
  dados-mariadb-bryan:
